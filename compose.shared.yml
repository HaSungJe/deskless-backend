# 공용 네트워크 · 볼륨 — 묶음(compose.*.yml)끼리 같이 쓰는 external 리소스의 선언은 여기 한곳이다.
#   - 각 묶음은 맨 위 `include: [compose.shared.yml]` 로 불러와 서비스에서 키(edge · service · broker · data · monitoring · files)로만 쓴다.
#     묶음 파일에 같은 키를 다시 선언하면 충돌한다 — 묶음 전용(로컬) 네트워크 · 볼륨(DB 데이터 · default)만 그 묶음 파일에 둔다.
#   - 실제 네트워크 · 볼륨은 `npm run docker:network`(scripts/docker-network.mjs)가 이 파일을 읽어 만든다(이미 있으면 건너뜀).
#     묶음을 내려도(down) 지워지지 않아 다른 묶음은 계속 동작한다.
#   - 새 공용 리소스는 여기에만 더한다 → npm run docker:network → 쓰는 서비스의 networks: 에 키.
#
# 형식(docker-network.mjs 가 YAML 파서 없이 이 모양만 읽는다 — 서버에서 npm install 전에도 돌아야 해서):
#   들여쓰기 4칸, 항목마다 한 줄씩 name · external: true · x-internal(네트워크만 — true 면 internal 망: 밖으로 나가는 길 · 호스트 포트 없음) · x-purpose(만들 때 보여 줄 설명)
networks:
    edge:
        name: deskless-edge
        external: true
        x-internal: false
        x-purpose: 'gateway-lb · gateway (외부 포트는 gateway-lb 만)'
    service:
        name: deskless-service
        external: true
        x-internal: true
        x-purpose: 'gateway → user-service-lb · admin-service-lb → 서비스 인스턴스 내부 HTTP'
    broker:
        name: deskless-broker
        external: true
        x-internal: false
        x-purpose: 'rabbitmq · gateway · user-service · admin-service'
    data:
        name: deskless-data
        external: true
        x-internal: false
        x-purpose: 'postgres · redis · migrate · 앱 4개 · DB · Redis 수집기 (외부 RDS · ElastiCache 도 이 길로 나간다)'
    monitoring:
        name: deskless-monitoring
        external: true
        x-internal: true
        x-purpose: 'prometheus → 앱 인스턴스 지표 포트(9464) · rabbitmq(15692) · 수집기 — 다른 프로젝트(프론트 web 등)도 여기에 붙는다(docs/guides/monitoring-integration.md)'

volumes:
    files:
        name: deskless-files
        external: true
        x-purpose: '내부 파일 저장소(AWS_S3_BUCKET 이 빌 때) — gateway · user-service · admin-service 의 /app/storage/files'
