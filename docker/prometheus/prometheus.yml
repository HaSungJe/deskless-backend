# Prometheus 설정 — compose.monitoring.yml 의 prometheus 가 읽는다(바꾼 뒤: docker compose -f compose.monitoring.yml restart prometheus)
#
# 앱(job = 서비스 이름)은 Docker 내장 DNS 로 서비스 이름의 인스턴스를 모두 찾아 긁는다 — --scale 로 늘리거나 줄이면 다음 회차(15초)에 따라간다.
# 앱 인스턴스(LB 아님)가 deskless-monitoring 에 붙어 있어야 서비스 이름이 그 인스턴스들로 풀린다. 지운 인스턴스는 DNS 에서 빠져 목록에서 사라진다.
# 다른 프로젝트를 붙일 때는 아래 "앱" 에 한 줄(서비스 이름 · 9464)만 더한다 — docs/guides/monitoring-integration.md
global:
    scrape_interval: 15s
    evaluation_interval: 15s

rule_files:
    - /etc/prometheus/rules.yml

scrape_configs:
    # ── 앱 (지표 전용 포트 9464 · /metrics) ──
    - job_name: gateway
      dns_sd_configs: [{names: [gateway], type: A, port: 9464, refresh_interval: 15s}]
    - job_name: user-service
      dns_sd_configs: [{names: [user-service], type: A, port: 9464, refresh_interval: 15s}]
    - job_name: admin-service
      dns_sd_configs: [{names: [admin-service], type: A, port: 9464, refresh_interval: 15s}]
    - job_name: scheduler
      dns_sd_configs: [{names: [scheduler], type: A, port: 9464, refresh_interval: 15s}]
    # 프론트 Next.js 서버(별도 저장소 — 같은 서버의 Docker, 서비스 이름 web). 아직 붙지 않았으면 대상 0개 — 오류 아님
    - job_name: web
      dns_sd_configs: [{names: [web], type: A, port: 9464, refresh_interval: 15s}]

    # ── RabbitMQ (이미지에 든 rabbitmq_prometheus 플러그인) ──
    # 큐별 지표(적체 · 처리 중 · 소비자) — detailed 엔드포인트에서 필요한 묶음만
    - job_name: rabbitmq-queues
      metrics_path: /metrics/detailed
      params:
          family: [queue_coarse_metrics, queue_consumer_count]
      static_configs: [{targets: ['rabbitmq:15692']}]
    # 브로커 전체(초당 발행 · 전달 · 연결)
    - job_name: rabbitmq
      static_configs: [{targets: ['rabbitmq:15692']}]

    # ── DB · Redis 수집기 ──
    - job_name: postgres
      static_configs: [{targets: ['postgres-exporter:9187']}]
    - job_name: redis
      static_configs: [{targets: ['redis-exporter:9121']}]
