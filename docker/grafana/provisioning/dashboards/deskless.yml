# Grafana 대시보드 — docker/grafana/dashboards/*.json 을 Deskless 폴더에 넣는다. 파일이 원본이라 화면에서 고친 것은 저장되지 않는다(고칠 때는 JSON 을 고친다)
apiVersion: 1
providers:
    - name: deskless
      folder: Deskless
      type: file
      disableDeletion: true
      allowUiUpdates: false
      options:
          path: /var/lib/grafana/dashboards
